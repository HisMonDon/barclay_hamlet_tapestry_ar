name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test static export
        run: python -m unittest test_static_export -v
      - name: Test browser playback
        run: node --test test_frontend.mjs
      # The board animation only depends on the show, art, renderer and libraries, not on web/. A push that only
      # changes the page reuses the last render; export_static.py --page-only still checks its fingerprint.
      - name: Restore rendered animation
        id: video
        uses: actions/cache/restore@v4
        with:
          path: |
            site/media/board.mp4
            site/data/video.json
          key: board-video-${{ hashFiles('*.py', '!test_*.py', 'config.json', 'beats*.json', 'assets/**', 'requirements.txt') }}
      - name: Render static demo
        id: render
        run: |
          if [ "${{ steps.video.outputs.cache-hit }}" = "true" ] && python export_static.py --out site --page-only; then
            echo "Reused the cached animation; only the page was rebuilt."
          else
            python export_static.py --out site
            echo "rendered=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save rendered animation
        if: steps.render.outputs.rendered == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            site/media/board.mp4
            site/data/video.json
          key: ${{ steps.video.outputs.cache-primary-key }}
      - name: Upload demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
